# Off-box uptime probe for monkei.mx.
#
# The VPS already runs scripts/uptime-check.sh every 5 minutes, but that cron
# dies with the host. This workflow runs on GitHub's runners so a dead VPS
# still produces a failed Actions run (and optional Telegram if secrets exist).
#
# Optional repository secrets (same names as production .env):
#   TELEGRAM_BOT_TOKEN
#   TELEGRAM_ALERT_CHAT_ID
# Without them the job still fails loudly when the site is down.

name: Uptime

on:
  schedule:
    # GitHub cron is best-effort; ~every 10 minutes is enough for "is it up".
    - cron: '*/10 * * * *'
  workflow_dispatch:
  # First enablement / edits to this file should prove the probe immediately.
  push:
    paths:
      - '.github/workflows/uptime.yml'

concurrency:
  group: uptime-monkei
  cancel-in-progress: true

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Probe store + panel health
        id: health
        run: |
          set -uo pipefail
          fail=""

          check() {
            local name="$1" url="$2"
            local code="000" attempt=1
            echo "::group::${name} ${url}"
            while [ "$attempt" -le 3 ]; do
              code="$(curl -sS --show-error --connect-timeout 10 --max-time 25 \
                -H 'User-Agent: monkei-uptime-gha/1.0' \
                -o /tmp/body.json -w '%{http_code}' \
                "$url" 2>/tmp/curl.err || true)"
              if [ -z "$code" ]; then code="000"; fi
              echo "attempt=${attempt} http=${code}"
              if [ -f /tmp/curl.err ] && [ -s /tmp/curl.err ]; then
                echo "curl_stderr:"
                cat /tmp/curl.err
              fi
              if [ -f /tmp/body.json ]; then
                echo "body:"
                head -c 300 /tmp/body.json || true
                echo
              fi
              if [ "$code" = "200" ] && grep -Eq '"status"[[:space:]]*:[[:space:]]*"ok"' /tmp/body.json 2>/dev/null; then
                echo "ok ${name}"
                echo "::endgroup::"
                return 0
              fi
              attempt=$((attempt + 1))
              sleep 2
            done
            echo "DOWN ${name}"
            fail="${fail}${fail:+; }${name}"
            echo "::endgroup::"
            return 0
          }

          check store https://monkei.mx/api/health
          check panel https://panel.monkei.mx/api/health

          if [ -n "$fail" ]; then
            echo "failed=${fail}" >> "$GITHUB_OUTPUT"
            echo "::error::External uptime failed for: ${fail}"
            exit 1
          fi
          echo "failed=" >> "$GITHUB_OUTPUT"
          echo "All health endpoints ok"

      - name: Telegram on failure
        if: failure()
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_ALERT_CHAT_ID: ${{ secrets.TELEGRAM_ALERT_CHAT_ID }}
        run: |
          if [ -z "${TELEGRAM_BOT_TOKEN}" ] || [ -z "${TELEGRAM_ALERT_CHAT_ID}" ]; then
            echo "TELEGRAM_* repository secrets not set — job failure is the external signal."
            exit 0
          fi
          text="$(printf '%s\n' \
            "External uptime DOWN on monkei.mx" \
            "Failed: ${{ steps.health.outputs.failed }}" \
            "Source: GitHub Actions workflow uptime.yml")"
          curl -fsS --max-time 15 \
            -X POST "https://api.telegram.org/bot${TELEGRAM_BOT_TOKEN}/sendMessage" \
            --data-urlencode "chat_id=${TELEGRAM_ALERT_CHAT_ID}" \
            --data-urlencode "text=${text}" \
            >/dev/null || echo "telegram notify failed"
